volumes:
  mysql_data:
  mysql_test_data:

services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
  php:
    container_name: ${APP_NAME}-php
    build:
      args:
        user: ${USER}
        uid: ${UID}
      context: ..
      dockerfile: docker/php/Dockerfile
    environment:
      DB_HOST: ${DB_HOST}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      TEST_DB_HOST: ${TEST_DB_HOST}
      TEST_DB_DATABASE: ${TEST_DB_DATABASE}
      TEST_DB_USERNAME: ${TEST_DB_USERNAME}
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD}
      PHP_IDE_CONFIG: ${PHP_IDE_CONFIG:-serverName=Docker}
    volumes:
      - ../:/var/www
      - ./docker-php-ext-xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
    working_dir: /var/www
    networks:
      - app
    depends_on:
      - db
  nginx:
    container_name: ${APP_NAME}-nginx
    restart: always
    build:
      context: nginx
      dockerfile: Dockerfile
    links:
      - php
      - db
    depends_on:
      - php
    ports:
      - ${NGINX_PORT_ON_HOST}:80
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ../.env:/var/www/.env
      - ../:/var/www
    environment:
      - PHP_FPM_HOST=${APP_NAME}-php
      - PHP_FPM_PORT=9000
    networks:
      - app
  db:
    container_name: ${APP_NAME}-db
    image: mysql:${MYSQL_VERSION}
    volumes:
      - "mysql_data:/var/lib/mysql"
    environment:
        MYSQL_DATABASE: ${DB_DATABASE}
        MYSQL_USER: ${DB_USERNAME}
        MYSQL_PASSWORD: ${DB_PASSWORD}
        MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    networks:
      - app
  db_test:
      container_name: ${APP_NAME}-db-test
      image: mysql:${MYSQL_VERSION}
      volumes:
        - mysql_test_data:/var/lib/mysql
      environment:
        MYSQL_DATABASE: ${TEST_DB_DATABASE}
        MYSQL_USER: ${TEST_DB_USERNAME}
        MYSQL_PASSWORD: ${TEST_DB_PASSWORD}
        MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      networks:
        - app
networks:
  app:
    driver: bridge
